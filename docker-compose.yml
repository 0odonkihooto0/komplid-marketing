services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
      # Именованные тома вместо анонимных: их видно в `docker volume ls`
      # и можно снести адресно. Оба переживают пересоздание контейнера,
      # поэтому их состояние проверяет docker/dev-entrypoint.sh при старте.
      - komplid_node_modules:/app/node_modules
      # Кэш сборки держим в томе, а не в примонтированном каталоге: иначе
      # он пишется в репозиторий на хосте, а на Windows это ещё и медленно.
      - komplid_next_cache:/app/.next
    ports:
      - "3200:3200"
    env_file:
      - .env.local
    environment:
      NODE_ENV: development

volumes:
  komplid_node_modules:
  komplid_next_cache:
