# Прод-запуск на собственном VDS — ЗАПАСНОЙ путь.
#
# Основной хостинг — Timeweb App Platform: приложение собирается платформой
# из Dockerfile, переменные задаются в панели, домен и TLS выдаются сами.
# Этот файл держим рабочим на случай переезда обратно на свой сервер.
#
# Запускать только с --env-file, иначе build-args ниже подставятся пустыми:
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_WAITLIST_MODE: ${NEXT_PUBLIC_WAITLIST_MODE}
        NEXT_PUBLIC_YANDEX_METRIKA_ID: ${NEXT_PUBLIC_YANDEX_METRIKA_ID}
        NEXT_PUBLIC_YANDEX_VERIFICATION: ${NEXT_PUBLIC_YANDEX_VERIFICATION}
        NEXT_PUBLIC_GOOGLE_VERIFICATION: ${NEXT_PUBLIC_GOOGLE_VERIFICATION}
        # Реквизиты ИП вмерзают в статические страницы на сборке — без них
        # в подвале печатался бы дефолт из company.ts, а не значение с сервера.
        COMPANY_NAME: ${COMPANY_NAME}
        COMPANY_INN: ${COMPANY_INN}
        COMPANY_OGRNIP: ${COMPANY_OGRNIP}
        COMPANY_EMAIL: ${COMPANY_EMAIL}
        COMPANY_PRIVACY_EMAIL: ${COMPANY_PRIVACY_EMAIL}
    restart: unless-stopped
    ports:
      # Только на петлевой интерфейс: наружу сайт отдаёт nginx с TLS. Иначе
      # http://IP:3100 работает в обход сертификата и уезжает в индекс дублем.
      - "127.0.0.1:3100:3000"
    env_file:
      - .env.production
    environment:
      # Куда складывать лиды внутри контейнера (см. том ниже).
      LEADS_DATA_DIR: /data
    volumes:
      # КРИТИЧНО: deploy.sh пересобирает образ на каждом деплое. Без именованного
      # тома собранная база пре-лонча (docs/memory/prelaunch-status.md) исчезнет
      # при первом же выкате. Бэкапить: docker run --rm -v komplid_leads:/data ...
      - leads:/data

volumes:
  leads:
